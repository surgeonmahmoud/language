<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  DrZiad — النسخة ذات الملف الواحد (Single-File)
  مولّدة آلياً من الملفات المنفصلة عبر build-single.cjs
  تعمل محلياً بالكامل دون خادم. لتعديل المحتوى عدّل الملفات
  المنفصلة ثم أعد توليد هذه النسخة.
======================================================== -->
  <title>DrZiad — دليل أنظمة الثانوية وجدولة الطلاب</title>
  <meta name="description" content="دليل مذاكراوي الداخلي لفهم أنظمة المرحلة الثانوية المصرية وإعداد جداول الطلاب للعام 2026/2027.">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <!-- خط عربي حديث (تحسين تجميلي اختياري)؛ يوجد بديل نظامي يعمل دون إنترنت -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;700;800&display=swap">
  <style id="app-styles">
/* =====================================================================
   DrZiad — نظام التصميم (Design System)
   RTL • عربي • Mobile-First • Light/Dark • Accessible
   ===================================================================== */

/* ----------------------------- Tokens ----------------------------- */
:root {
  color-scheme: light;
  /* الهوية: أخضر زمردي داكن احترافي (أساسي) + كهرماني (مساعد) */
  --brand:        #0f766e;   /* teal-700 */
  --brand-dark:   #115e59;
  --brand-soft:   #ccfbf1;
  --accent:       #b45309;   /* amber-700 */
  --accent-soft:  #fef3c7;

  --bg:           #f4f6f8;
  --surface:      #ffffff;
  --surface-2:    #f8fafc;
  --surface-3:    #eef2f6;
  --border:       #e2e8f0;
  --border-strong:#cbd5e1;
  --text:         #0f172a;
  --text-soft:    #475569;
  --text-faint:   #64748b;
  --shadow:       0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.05);
  --shadow-lg:    0 8px 30px rgba(15,23,42,.12);
  --ring:         0 0 0 3px rgba(15,118,110,.35);

  /* مستويات الثقة A–E */
  --confA:#166534; --confA-bg:#dcfce7; --confA-bd:#86efac;
  --confB:#1d4ed8; --confB-bg:#dbeafe; --confB-bd:#93c5fd;
  --confC:#b45309; --confC-bg:#fef3c7; --confC-bd:#fcd34d;
  --confD:#6d28d9; --confD-bg:#ede9fe; --confD-bd:#c4b5fd;
  --confE:#b91c1c; --confE-bg:#fee2e2; --confE-bd:#fca5a5;

  --ok:#15803d; --warn:#b45309; --danger:#b91c1c; --info:#1d4ed8;

  --radius:14px; --radius-sm:9px; --radius-pill:999px;
  --sidebar-w:264px; --header-h:62px;
  --fs: 16px;
  --font: "Tajawal","Cairo","Noto Kufi Arabic","Segoe UI",Tahoma,Arial,system-ui,sans-serif;
  --maxw: 1200px;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --brand:#2dd4bf; --brand-dark:#5eead4; --brand-soft:#134e4a; --accent:#fbbf24; --accent-soft:#3f2d10;
  --bg:#0b1220; --surface:#111a2b; --surface-2:#0f1830; --surface-3:#1b2740;
  --border:#243247; --border-strong:#334867;
  --text:#e8eef6; --text-soft:#aeb9c9; --text-faint:#8695a9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 10px 34px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(45,212,191,.4);
  --confA:#4ade80; --confA-bg:#09301c; --confA-bd:#166534;
  --confB:#60a5fa; --confB-bg:#102347; --confB-bd:#1d4ed8;
  --confC:#fbbf24; --confC-bg:#3a2a08; --confC-bd:#b45309;
  --confD:#c4b5fd; --confD-bg:#241a44; --confD-bd:#6d28d9;
  --confE:#f87171; --confE-bg:#3c1414; --confE-bd:#b91c1c;
  --ok:#4ade80; --warn:#fbbf24; --danger:#f87171; --info:#60a5fa;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --brand:#2dd4bf; --brand-dark:#5eead4; --brand-soft:#134e4a; --accent:#fbbf24; --accent-soft:#3f2d10;
    --bg:#0b1220; --surface:#111a2b; --surface-2:#0f1830; --surface-3:#1b2740;
    --border:#243247; --border-strong:#334867;
    --text:#e8eef6; --text-soft:#aeb9c9; --text-faint:#8695a9;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
    --shadow-lg:0 10px 34px rgba(0,0,0,.5);
    --ring:0 0 0 3px rgba(45,212,191,.4);
    --confA:#4ade80; --confA-bg:#09301c; --confA-bd:#166534;
    --confB:#60a5fa; --confB-bg:#102347; --confB-bd:#1d4ed8;
    --confC:#fbbf24; --confC-bg:#3a2a08; --confC-bd:#b45309;
    --confD:#c4b5fd; --confD-bg:#241a44; --confD-bd:#6d28d9;
    --confE:#f87171; --confE-bg:#3c1414; --confE-bd:#b91c1c;
    --ok:#4ade80; --warn:#fbbf24; --danger:#f87171; --info:#60a5fa;
  }
}

/* ----------------------------- Base ----------------------------- */
*,*::before,*::after { box-sizing:border-box; }
html { font-size:var(--fs); -webkit-text-size-adjust:100%; }
body {
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  direction:rtl; line-height:1.7; letter-spacing:0; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4 { margin:0 0 .5rem; line-height:1.35; font-weight:800; color:var(--text); }
h1{font-size:1.5rem;} h2{font-size:1.25rem;} h3{font-size:1.08rem;} h4{font-size:1rem;}
p{margin:0 0 .7rem;} a{color:var(--brand-dark);}
small{color:var(--text-faint);}
code,.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;direction:ltr;unicode-bidi:isolate;}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block;}
hr{border:none;border-top:1px solid var(--border);margin:1rem 0;}
::selection{background:var(--brand-soft);color:var(--text);}

/* Scrollbar */
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;}
*::-webkit-scrollbar{width:10px;height:10px;}
*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;}

/* Focus visibility */
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px;}
.skip-link{position:fixed;inset-inline-start:50%;transform:translateX(50%);top:-60px;z-index:200;
  background:var(--brand);color:#fff;padding:.6rem 1rem;border-radius:0 0 10px 10px;transition:top .2s;}
.skip-link:focus{top:0;}

/* ----------------------------- Layout ----------------------------- */
.app{min-height:100vh;}
.header{
  position:sticky;top:0;z-index:50;height:var(--header-h);display:flex;align-items:center;gap:.6rem;
  padding:0 clamp(12px,3vw,20px);background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0;}
.brand .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;font-weight:900;font-size:.95rem;box-shadow:var(--shadow);}
.brand .ttl{min-width:0;}
.brand .ttl b{display:block;font-size:.98rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;}
.brand .ttl span{display:block;font-size:.72rem;color:var(--text-faint);}
.header .spacer{flex:1;}
.header .meta-chip{display:none;}
@media(min-width:900px){.header .meta-chip{display:inline-flex;}}

.layout{display:flex;align-items:flex-start;}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);position:sticky;top:var(--header-h);
  height:calc(100vh - var(--header-h));overflow:auto;padding:.9rem .7rem 3rem;
  background:var(--surface);border-inline-start:1px solid var(--border);
}
.main{flex:1;min-width:0;padding:clamp(14px,2.5vw,26px);max-width:var(--maxw);margin-inline:auto;width:100%;}
.breadcrumbs{font-size:.82rem;color:var(--text-faint);margin-bottom:.7rem;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;}
.breadcrumbs a{color:var(--text-soft);text-decoration:none;} .breadcrumbs a:hover{color:var(--brand-dark);}

/* ----------------------------- Buttons ----------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;cursor:pointer;
  font-family:inherit;font-size:.9rem;font-weight:700;line-height:1;padding:.6rem .9rem;border-radius:10px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);transition:.16s ease;
}
.btn:hover{border-color:var(--brand);color:var(--brand-dark);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn.primary:hover{background:var(--brand-dark);color:#fff;}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.ghost:hover{background:var(--surface-3);}
.btn.danger{border-color:var(--confE-bd);color:var(--danger);}
.btn.danger:hover{background:var(--confE-bg);}
.btn.sm{padding:.4rem .6rem;font-size:.8rem;border-radius:8px;}
.btn.block{width:100%;}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;}
.icon-btn{width:40px;height:40px;padding:0;border-radius:10px;font-size:1.1rem;flex:0 0 auto;}

/* ----------------------------- Sidebar nav ----------------------------- */
.nav-group{margin-bottom:.4rem;}
.nav-group>.nav-title{display:flex;align-items:center;justify-content:space-between;width:100%;cursor:pointer;
  font-size:.74rem;font-weight:800;color:var(--text-faint);letter-spacing:.3px;padding:.5rem .6rem;border:none;background:none;text-align:start;}
.nav-group .nav-title .chev{transition:transform .2s;font-size:.7rem;}
.nav-group.collapsed .nav-title .chev{transform:rotate(-90deg);}
.nav-group.collapsed .nav-items{display:none;}
.nav-items{display:flex;flex-direction:column;gap:2px;}
.nav-link{display:flex;align-items:center;gap:.55rem;padding:.5rem .6rem;border-radius:9px;color:var(--text-soft);
  text-decoration:none;font-size:.9rem;font-weight:600;border:1px solid transparent;}
.nav-link .ic{font-size:1rem;width:1.3rem;text-align:center;flex:0 0 auto;}
.nav-link:hover{background:var(--surface-3);color:var(--text);}
.nav-link.active{background:var(--brand-soft);color:var(--brand-dark);border-color:var(--brand);font-weight:800;}
:root[data-theme="dark"] .nav-link.active{color:var(--brand);}

/* ----------------------------- Cards & grids ----------------------------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow);}
.card.pad-lg{padding:1.4rem;}
.card h3{margin-top:0;}
.grid{display:grid;gap:14px;}
.grid.c2{grid-template-columns:repeat(2,1fr);}
.grid.c3{grid-template-columns:repeat(3,1fr);}
.grid.c4{grid-template-columns:repeat(4,1fr);}
.grid.auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
@media(max-width:860px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr;}}
@media(min-width:861px) and (max-width:1050px){.grid.c3,.grid.c4{grid-template-columns:repeat(2,1fr);}}

.page-head{margin-bottom:1rem;}
.page-head .lead{color:var(--text-soft);max-width:72ch;}
.section-title{display:flex;align-items:center;gap:.5rem;margin:1.4rem 0 .7rem;font-size:1.15rem;font-weight:800;}
.section-title::before{content:"";width:4px;height:1.1em;background:var(--brand);border-radius:4px;}

/* Stat tiles */
.stat{display:flex;flex-direction:column;gap:.15rem;padding:.9rem 1rem;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);}
.stat .num{font-size:1.7rem;font-weight:900;color:var(--brand-dark);line-height:1;}
:root[data-theme="dark"] .stat .num{color:var(--brand);}
.stat .lbl{font-size:.82rem;color:var(--text-soft);}

/* Quick access tiles */
.tile{display:flex;align-items:center;gap:.7rem;padding:.85rem 1rem;border-radius:var(--radius);cursor:pointer;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);text-decoration:none;color:var(--text);transition:.16s;}
.tile:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.tile .ic{font-size:1.4rem;width:2.4rem;height:2.4rem;border-radius:11px;display:grid;place-items:center;background:var(--surface-3);flex:0 0 auto;}
.tile b{font-size:.95rem;} .tile small{color:var(--text-faint);}

/* ----------------------------- Badges ----------------------------- */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.74rem;font-weight:800;padding:.2rem .55rem;border-radius:var(--radius-pill);
  border:1px solid var(--border-strong);background:var(--surface-3);color:var(--text-soft);white-space:nowrap;}
.conf{display:inline-flex;align-items:center;gap:.3rem;font-size:.74rem;font-weight:800;padding:.18rem .5rem;border-radius:var(--radius-pill);border:1px solid;cursor:help;}
.conf .dot{width:.6rem;height:.6rem;border-radius:50%;}
.conf.A{color:var(--confA);background:var(--confA-bg);border-color:var(--confA-bd);} .conf.A .dot{background:var(--confA);}
.conf.B{color:var(--confB);background:var(--confB-bg);border-color:var(--confB-bd);} .conf.B .dot{background:var(--confB);}
.conf.C{color:var(--confC);background:var(--confC-bg);border-color:var(--confC-bd);} .conf.C .dot{background:var(--confC);}
.conf.D{color:var(--confD);background:var(--confD-bg);border-color:var(--confD-bd);} .conf.D .dot{background:var(--confD);}
.conf.E{color:var(--confE);background:var(--confE-bg);border-color:var(--confE-bd);} .conf.E .dot{background:var(--confE);}
.pill-added{color:var(--confA);background:var(--confA-bg);border-color:var(--confA-bd);}
.pill-not{color:var(--confC);background:var(--confC-bg);border-color:var(--confC-bd);}
.pill-pass{color:var(--info);background:var(--confB-bg);border-color:var(--confB-bd);}

/* ----------------------------- Alerts ----------------------------- */
.alert{display:flex;gap:.6rem;padding:.8rem 1rem;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
  background:var(--surface-2);margin:.7rem 0;}
.alert .ic{font-size:1.1rem;flex:0 0 auto;}
.alert.warn{background:var(--confC-bg);border-color:var(--confC-bd);color:var(--confC);}
.alert.danger{background:var(--confE-bg);border-color:var(--confE-bd);color:var(--confE);}
.alert.info{background:var(--confB-bg);border-color:var(--confB-bd);color:var(--confB);}
.alert.ok{background:var(--confA-bg);border-color:var(--confA-bd);color:var(--confA);}
.alert b{color:inherit;}
.alert .body{color:var(--text);}
.alert.warn .body,.alert.danger .body,.alert.info .body,.alert.ok .body{color:inherit;}

/* ----------------------------- Tables ----------------------------- */
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);background:var(--surface);}
table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:520px;}
thead th{position:sticky;top:0;background:var(--surface-3);text-align:start;padding:.6rem .7rem;font-weight:800;
  color:var(--text);border-bottom:1px solid var(--border-strong);white-space:nowrap;z-index:1;}
tbody td{padding:.55rem .7rem;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text-soft);}
tbody tr:hover{background:var(--surface-2);}
tbody tr:last-child td{border-bottom:none;}

/* ----------------------------- Filter bar ----------------------------- */
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.9rem;}
.field{display:flex;flex-direction:column;gap:.25rem;}
.field label{font-size:.76rem;font-weight:700;color:var(--text-soft);}
.input,select,textarea{font-family:inherit;font-size:.9rem;padding:.5rem .65rem;border-radius:9px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);min-width:120px;}
textarea{min-height:72px;resize:vertical;width:100%;}
.input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:var(--ring);outline:none;}
.search-input{flex:1;min-width:180px;}
.count-chip{font-size:.8rem;color:var(--text-faint);margin-inline-start:auto;}
mark{background:var(--accent-soft);color:var(--text);padding:0 .1em;border-radius:3px;}

/* ----------------------------- Accordion ----------------------------- */
.acc{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow);margin-bottom:.7rem;}
.acc>summary{list-style:none;cursor:pointer;padding:.85rem 1rem;display:flex;align-items:center;gap:.6rem;font-weight:800;}
.acc>summary::-webkit-details-marker{display:none;}
.acc>summary::after{content:"▾";margin-inline-start:auto;transition:transform .2s;color:var(--text-faint);}
.acc[open]>summary::after{transform:rotate(180deg);}
.acc>summary:hover{background:var(--surface-2);}
.acc .acc-body{padding:0 1rem 1rem;border-top:1px solid var(--border);}

/* key-value rows */
.kv{display:grid;grid-template-columns:max-content 1fr;gap:.3rem .8rem;font-size:.88rem;margin:.5rem 0;}
.kv dt{font-weight:800;color:var(--text);}
.kv dd{margin:0;color:var(--text-soft);}

/* progress */
.progress{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden;border:1px solid var(--border);}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-dark));transition:width .35s;}

/* checkbox list */
.check-item{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .6rem;border-radius:9px;border:1px solid transparent;}
.check-item:hover{background:var(--surface-2);}
.check-item input{margin-top:.25rem;width:1.1rem;height:1.1rem;accent-color:var(--brand);flex:0 0 auto;}
.check-item.done label{text-decoration:line-through;color:var(--text-faint);}
.tag{font-size:.68rem;font-weight:800;padding:.12rem .45rem;border-radius:999px;border:1px solid var(--border-strong);}
.tag.crit{color:var(--danger);background:var(--confE-bg);border-color:var(--confE-bd);}
.tag.imp{color:var(--warn);background:var(--confC-bg);border-color:var(--confC-bd);}
.tag.sup{color:var(--text-faint);}

/* quiz */
.q-card{border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;background:var(--surface);box-shadow:var(--shadow);margin-bottom:.8rem;}
.q-opt{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .7rem;border:1px solid var(--border-strong);border-radius:10px;cursor:pointer;margin:.35rem 0;transition:.12s;}
.q-opt:hover{border-color:var(--brand);background:var(--surface-2);}
.q-opt.sel{border-color:var(--brand);background:var(--brand-soft);}
.q-opt.correct{border-color:var(--confA-bd);background:var(--confA-bg);}
.q-opt.wrong{border-color:var(--confE-bd);background:var(--confE-bg);}
.q-opt input{margin-top:.2rem;accent-color:var(--brand);}

/* modal / overlay */
.overlay{position:fixed;inset:0;z-index:120;background:rgba(5,10,20,.55);display:none;align-items:flex-start;justify-content:center;padding:6vh 14px 14px;}
.overlay.open{display:flex;}
.modal{width:min(720px,100%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:86vh;overflow:auto;}
.modal-head{display:flex;align-items:center;gap:.6rem;padding:.9rem 1rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);}
.modal-body{padding:1rem;}

/* search results */
.search-result{display:block;padding:.6rem .7rem;border-radius:9px;border:1px solid var(--border);margin-bottom:.4rem;cursor:pointer;background:var(--surface-2);text-decoration:none;color:var(--text);}
.search-result:hover{border-color:var(--brand);}
.search-result .type{font-size:.7rem;color:var(--brand-dark);font-weight:800;}
:root[data-theme="dark"] .search-result .type{color:var(--brand);}
.search-result .path{font-size:.72rem;color:var(--text-faint);}

/* empty / error */
.empty{text-align:center;padding:2rem 1rem;color:var(--text-faint);}
.empty .ic{font-size:2rem;display:block;margin-bottom:.4rem;}

/* mobile nav */
.backdrop{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:40;display:none;}
.backdrop.open{display:block;}
.menu-btn{display:none;}
.to-top{position:fixed;inset-inline-end:16px;bottom:16px;z-index:45;width:44px;height:44px;border-radius:50%;
  box-shadow:var(--shadow-lg);display:none;align-items:center;justify-content:center;font-size:1.2rem;background:var(--brand);color:#fff;border:none;cursor:pointer;}
.to-top.show{display:flex;}

@media(max-width:900px){
  .menu-btn{display:inline-flex;}
  .sidebar{position:fixed;top:0;height:100vh;z-index:60;inset-inline-start:0;transform:translateX(-105%);
    transition:transform .25s;box-shadow:var(--shadow-lg);padding-top:1rem;}

<script>/* storage.js */
/* =====================================================================
   DrZiad — طبقة التخزين المحلي (Local-First Storage)
   كل المفاتيح تبدأ بـ drziad_ . كل العمليات محاطة بـ try/catch حتى تعمل
   الواجهة بأمان في وضع التصفح الخاص أو عند حجب التخزين.
   لا تُرسل أي بيانات لأي جهة إطلاقاً.
   ===================================================================== */
(function () {
  "use strict";
  const PREFIX = "drziad_";
  const VERSION = 1;

  function safeGet(key, fallback) {
    try {
      const raw = localStorage.getItem(PREFIX + key);
      if (raw == null) return fallback;
      return JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function safeSet(key, value) {
    try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }
  function safeRemove(key) {
    try { localStorage.removeItem(PREFIX + key); return true; } catch (e) { return false; }
  }
  function available() {
    try { const t = PREFIX + "__t"; localStorage.setItem(t, "1"); localStorage.removeItem(t); return true; }
    catch (e) { return false; }
  }

  /* قائمة المفاتيح المعروفة (للتصدير/الاستيراد/المسح) */
  const KEYS = {
    theme:        "theme",
    fontScale:    "font_scale",
    lastRoute:    "last_route",
    navState:     "nav_state",
    readSections: "read_sections",
    sectionVisits:"section_visits",
    checklist:    "checklist",
    checklistMeta:"checklist_meta",
    cases:        "cases_progress",
    quizState:    "quiz_state",
    quizAttempts: "quiz_attempts",
    studentForm:  "student_form",
    bookmarks:    "bookmarks",
    notes:        "notes",
    filters:      "filters",
    mistakes:     "mistakes_state",
    settings:     "settings",
    activity:     "activity_log",
    doctor:       "doctor_profile",
    adminUnlocked:"admin_unlocked",
    sectionVis:   "section_visibility"
  };

  /* سجل النشاط المحلي (غير حساس) */
  function logActivity(type, label) {
    try {
      const log = safeGet(KEYS.activity, []);
      log.unshift({ type, label, at: new Date().toISOString() });
      safeSet(KEYS.activity, log.slice(0, 80));
    } catch (e) {}
  }

  /* تتبع فتح الأقسام */
  function markVisit(sectionId) {
    const visits = safeGet(KEYS.sectionVisits, {});
    visits[sectionId] = { last: new Date().toISOString(), count: (visits[sectionId]?.count || 0) + 1 };
    safeSet(KEYS.sectionVisits, visits);
  }
  function markRead(sectionId, value) {
    const read = safeGet(KEYS.readSections, {});
    if (value === false) delete read[sectionId]; else read[sectionId] = new Date().toISOString();
    safeSet(KEYS.readSections, read);
    logActivity("read", sectionId);
  }
  function isRead(sectionId) { return !!safeGet(KEYS.readSections, {})[sectionId]; }

  /* ---------------- التصدير / الاستيراد ---------------- */
  function exportAll() {
    const payload = { app: "DrZiad", schema: VERSION, exportedAt: new Date().toISOString(), data: {} };
    Object.values(KEYS).forEach(k => {
      const v = safeGet(k, null);
      if (v !== null) payload.data[k] = v;
    });
    return payload;
  }

  function validateBackup(obj) {
    const errors = [];
    if (!obj || typeof obj !== "object") { errors.push("الملف غير صالح أو ليس بصيغة JSON."); return { ok:false, errors }; }
    if (obj.app !== "DrZiad") errors.push("الملف لا يخص مشروع DrZiad.");
    if (typeof obj.schema !== "number") errors.push("إصدار الملف (schema) مفقود.");
    if (!obj.data || typeof obj.data !== "object") errors.push("حقل البيانات (data) مفقود أو تالف.");
    if (obj.data) {
      const known = Object.values(KEYS);
      Object.keys(obj.data).forEach(k => { if (!known.includes(k)) errors.push("مفتاح غير معروف سيُتجاهل: " + k); });
    }
    const fatal = errors.filter(e => !e.startsWith("مفتاح غير معروف"));
    return { ok: fatal.length === 0, errors, fatalCount: fatal.length };
  }

  function summarizeBackup(obj) {
    if (!obj || !obj.data) return [];
    const map = {
      checklist:"قائمة التحقق", cases_progress:"الحالات التدريبية", quiz_attempts:"محاولات الاختبار",
      student_form:"نموذج الطالب", bookmarks:"المحفوظات", notes:"الملاحظات", doctor_profile:"ملف الدكتور",
      read_sections:"الأقسام المقروءة", mistakes_state:"حالة الأخطاء", settings:"الإعدادات"
    };
    return Object.keys(obj.data).map(k => {
      const v = obj.data[k];
      let n = "";
      if (Array.isArray(v)) n = v.length + " عنصر";
      else if (v && typeof v === "object") n = Object.keys(v).length + " حقل";
      return { key: map[k] || k, info: n };
    });
  }

  function importBackup(obj, mode) { // mode: "replace" | "merge"
    const v = validateBackup(obj);
    if (!v.ok) return v;
    const known = Object.values(KEYS);
    Object.keys(obj.data).forEach(k => {
      if (!known.includes(k)) return;
      if (mode === "replace") { safeSet(k, obj.data[k]); return; }
      // merge
      const cur = safeGet(k, null);
      const incoming = obj.data[k];
      if (Array.isArray(cur) && Array.isArray(incoming)) safeSet(k, cur.concat(incoming));
      else if (cur && typeof cur === "object" && incoming && typeof incoming === "object") safeSet(k, Object.assign({}, cur, incoming));
      else safeSet(k, incoming);
    });
    logActivity("import", mode);
    return { ok: true, errors: v.errors };
  }

  function clearAll() {
    try {
      const toRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.indexOf(PREFIX) === 0) toRemove.push(key);
      }
      toRemove.forEach(k => localStorage.removeItem(k));
      return true;
    } catch (e) { return false; }
  }

  window.DZStore = {
    PREFIX, KEYS, available,
    get: safeGet, set: safeSet, remove: safeRemove,
    logActivity, markVisit, markRead, isRead,
    exportAll, validateBackup, summarizeBackup, importBackup, clearAll
  };
})();

</script>
<script>/* search.js */
/* =====================================================================
   DrZiad — محرك البحث الموحد (Local, Arabic-aware)
   - تجاهل التشكيل.
   - توحيد الألف والهمزة (أ إ آ ا)، والياء والألف المقصورة (ي ى)،
     والتاء المربوطة والهاء (ة ه)، والواو بالهمزة (ؤ و).
   - دعم البحث بالمصطلح الإنجليزي والاختصار.
   يعمل كلياً دون خادم.
   ===================================================================== */
(function () {
  "use strict";

  const TASHKEEL = /[ؐ-ًؚ-ٰٟۖ-ۭـ]/g; // حركات + تطويل
  function normalize(str) {
    if (str == null) return "";
    return String(str)
      .replace(TASHKEEL, "")
      .replace(/[أإآٱ]/g, "ا") // أ إ آ ٱ -> ا
      .replace(/ى/g, "ي")                      // ى -> ي
      .replace(/ة/g, "ه")                      // ة -> ه
      .replace(/ؤ/g, "و")                      // ؤ -> و
      .replace(/ئ/g, "ي")                      // ئ -> ي
      .replace(/[^؀-ۿa-zA-Z0-9]+/g, " ")        // رموز -> مسافة
      .toLowerCase()
      .replace(/\s+/g, " ")
      .trim();
  }

  let INDEX = [];

  function add(list, type, typeLabel, route) {
    (list || []).forEach(x => INDEX.push({
      type, typeLabel, route,
      title: x.title, subtitle: x.subtitle || "",
      hay: normalize(x.terms.filter(Boolean).join(" "))
    }));
  }

  function build(D) {
    INDEX = [];
    // الصفحات
    D.navigation.forEach(g => g.items.forEach(i =>
      INDEX.push({ type:"page", typeLabel:"صفحة", route:"#/"+i.id, title:i.label, subtitle:g.group, hay:normalize(i.label+" "+i.id+" "+g.group) })));
    // الأنظمة
    add(D.systems.map(s => ({ title:s.name, subtitle:s.en, terms:[s.name,s.en,s.id,s.key] })), "system","نظام","#/systems-map");
    // المواد
    add(D.subjects.map(s => ({ title:s.ar, subtitle:s.en+" · "+s.abbr, terms:[s.ar,s.en,s.official,s.abbr,s.context,s.nature] })), "subject","مادة","#/subjects");
    // الاختصارات
    add(D.abbreviations.map(a => ({ title:a.abbr, subtitle:a.meaning, terms:[a.abbr,a.meaning,a.context] })), "abbr","اختصار","#/abbreviations");
    // مستويات اللغات
    add(D.languageLevels.map(l => ({ title:l.term, subtitle:l.system, terms:[l.term,l.system,l.meaning] })), "lang","مستوى لغة","#/language-levels");
    // مصطلحات التقييم
    add(D.assessmentTerms.map(t => ({ title:t.en, subtitle:t.ar, terms:[t.en,t.ar,t.schedule] })), "assess","مصطلح تقييم","#/classwork");
    // قواعد الدرجات
    add(D.gradingRules.map(r => ({ title:r.title, subtitle:r.id, terms:[r.title,r.text,r.id] })), "rule","قاعدة درجات","#/grades");
    // الأخطاء
    add(D.mistakes.map(m => ({ title:m.err, subtitle:m.id, terms:[m.err,m.impact,m.action,m.id] })), "mistake","خطأ شائع","#/mistakes");
    // الحالات
    add(D.cases.map(c => ({ title:c.title, subtitle:c.id, terms:[c.title,c.available,c.decision,c.id] })), "case","حالة تدريبية","#/cases");
    // المصادر
    add(D.sources.map(s => ({ title:s.id, subtitle:s.title, terms:[s.id,s.title,s.authority] })), "source","مصدر","#/sources");
    // غير المحسوم
    add(D.unresolved.map(u => ({ title:u.issue, subtitle:u.id, terms:[u.issue,u.gap,u.safe,u.id] })), "unres","غير محسوم","#/unresolved");
    // الدولية
    add(D.international.map(i => ({ title:i.name, subtitle:i.en, terms:[i.name,i.en,i.def] })), "intl","نظام دولي","#/international");
    return INDEX.length;
  }

  function query(q, limit) {
    const n = normalize(q);
    if (!n) return [];
    const parts = n.split(" ").filter(Boolean);
    const scored = [];
    INDEX.forEach(item => {
      let score = 0, ok = true;
      parts.forEach(p => {
        const idx = item.hay.indexOf(p);
        if (idx === -1) { ok = false; }
        else { score += (idx === 0 ? 3 : 1) + Math.max(0, 6 - idx / 6); }
      });
      if (ok) {
        if (normalize(item.title).indexOf(parts[0]) === 0) score += 5;
        scored.push({ item, score });
      }
    });
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, limit || 40).map(s => s.item);
  }

  function highlight(text, q) {
    const n = normalize(q).split(" ").filter(Boolean);
    if (!n.length || text == null) return document.createTextNode(text == null ? "" : String(text));
    // نحدد المواضع على نسخة طبيعية ونعلّمها على النص الأصلي بمطابقة الطول تقريبياً
    const frag = document.createDocumentFragment();
    const original = String(text);
    const low = normalize(original);
    let cursor = 0, placed = false;
    // أبسط وأأمن: إبراز أول مطابقة لكل كلمة في النص الأصلي بمطابقة غير حساسة
    const ranges = [];
    n.forEach(p => {
      let i = low.indexOf(p);
      while (i !== -1) { ranges.push([i, i + p.length]); i = low.indexOf(p, i + p.length); }
    });
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [];
    ranges.forEach(r => {
      if (merged.length && r[0] <= merged[merged.length - 1][1]) merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], r[1]);
      else merged.push(r.slice());
    });
    merged.forEach(r => {
      if (r[0] > cursor) frag.appendChild(document.createTextNode(original.slice(cursor, r[0])));
      const m = document.createElement("mark");
      m.textContent = original.slice(r[0], r[1]);
      frag.appendChild(m); cursor = r[1]; placed = true;
    });
    if (cursor < original.length) frag.appendChild(document.createTextNode(original.slice(cursor)));
    return placed ? frag : document.createTextNode(original);
  }

  window.DZSearch = { normalize, build, query, highlight };
})();

</script>
<script>/* app.js */
/* =====================================================================
   DrZiad — منطق التطبيق (Router + Views + Interactions)
   يعتمد على: data.js (DRZIAD_DATA), storage.js (DZStore), search.js (DZSearch)
   كل المحتوى من قاعدة المعرفة فقط — لا يُخترع أي رقم أو قاعدة.
   الأمان: كل النصوص تُدرج عبر textContent؛ ولا تُنفّذ أكواد مستوردة.
   ===================================================================== */
(function () {
  "use strict";
  const D = window.DRZIAD_DATA;
  const S = window.DZStore;
  const Q = window.DZSearch;
  if (!D) { document.body.textContent = "تعذّر تحميل قاعدة البيانات (data.js)."; return; }

  /* ----------------------------- DOM helpers ----------------------------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "text") el.textContent = v;
        else if (k === "html") { /* محظور للبيانات؛ يُستخدم فقط لأيقونات ثابتة */ el.innerHTML = v; }
        else if (k === "onclick") el.addEventListener("click", v);
        else if (k === "oninput") el.addEventListener("input", v);
        else if (k === "onchange") el.addEventListener("change", v);
        else if (k === "onsubmit") el.addEventListener("submit", v);
        else if (k === "dataset") Object.assign(el.dataset, v);
        else if (k in el && k !== "list" && typeof v !== "object") { try { el[k] = v; } catch(e){ el.setAttribute(k, v);} }
        else el.setAttribute(k, v);
      }
    }
    appendKids(el, kids);
    return el;
  }
  function appendKids(el, kids) {
    kids.forEach(kid => {
      if (kid == null || kid === false) return;
      if (Array.isArray(kid)) appendKids(el, kid);
      else if (kid instanceof Node) el.appendChild(kid);
      else el.appendChild(document.createTextNode(String(kid)));
    });
  }
  const frag = (...kids) => { const f = document.createDocumentFragment(); appendKids(f, kids); return f; };
  const clear = el => { while (el.firstChild) el.removeChild(el.firstChild); };
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

  function toast(msg) {
    let t = $("#toast");
    if (!t) { t = h("div", { id:"toast", class:"toast", role:"status", "aria-live":"polite" }); document.body.appendChild(t); }

  /* ---------- الأخطاء الشائعة ---------- */
  function tagMistake(m) {
    const txt = m.err + " " + m.impact + " " + m.action + " " + m.detect;
    const tags = [];
    if (/لغات|اللغات|اللغة الإنجليزية|المصطلح/.test(txt)) tags.push("اللغات");
    if (/الثانوية العامة|ثالثة ثانوي عام|الجيولوجيا|الفلسفة|مقالي/.test(txt)) tags.push("الثانوية العامة");
    if (/بكالوريا/.test(txt)) tags.push("البكالوريا");
    if (/الأزهر|القرآن|شرعي/.test(txt)) tags.push("الأزهر");
    if (/IGCSE|Core|Extended|دولي|EST/.test(txt)) tags.push("الدولي");
    if (/Class Work|الواجب|التقييم|أعمال السنة|كشكول/.test(txt)) tags.push("التقييمات");
    if (/تنسيق|التنسيق/.test(txt)) tags.push("التنسيق");
    if (/جدول|الجدول|شهري|أولوية/.test(txt)) tags.push("الجدولة");
    if (/الرياضيات|Math|فرع|ديناميكا/.test(txt)) tags.push("الجدولة");
    return Array.from(new Set(tags));
  }
  function mistakeCard(m) {
    const state = (S.get(S.KEYS.mistakes, {})[m.id]) || "";

      onchange: e => { const o = S.get(S.KEYS.mistakes, {}); o[m.id] = e.target.value; S.set(S.KEYS.mistakes, o); toast("تم الحفظ"); } },

      h("div", { class:"toolbar", style:"margin:0 0 .3rem" }, h("b", null, m.id + " — " + m.err),

  function examRunner() {
    const box = h("div");
    let state = S.get(S.KEYS.quizState, null);
    const buildOrder = (shuffle) => {
      const idx = D.examBank.map((_, i) => i);
      if (shuffle) for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
      return idx;
    };
    const start = (shuffle) => { state = { order: buildOrder(shuffle), answers: {}, submitted:false, at:new Date().toISOString() }; S.set(S.KEYS.quizState, state); render(); };

    const render = () => {
      clear(box);
      if (!state) {
        box.appendChild(h("div", { class:"toolbar" },

      state.order.forEach((qi, pos) => box.appendChild(qCard(D.examBank[qi], qi, pos + 1)));

      if (!state.submitted) {

          h("button", { class:"btn primary", onclick: submit }, "إنهاء وتسليم"),
          h("button", { class:"btn danger", onclick: () => { S.remove(S.KEYS.quizState); state=null; render(); } }, "إلغاء")));
      } else {

        h("span", { class:"badge" }, qTypeLabel(qq.type)), h("b", null, "س" + num)), h("p", null, qq.q));

        [["صواب", true], ["خطأ", false]].forEach(([label, val]) => c.appendChild(optRow(qi, qq, label, val, sel)));
      } else {
        qq.options.forEach((opt, i) => c.appendChild(optRow(qi, qq, opt, i, sel)));
      }
      if (state.submitted) {
        const correct = qq.type === "tf" ? qq.answer : qq.answer;
        c.appendChild(h("div", { class:"alert " + (isCorrect(qq, sel) ? "ok" : "danger") },
          h("span", { class:"ic" }, isCorrect(qq, sel) ? "✅" : "✖️"),
          h("div", { class:"body" }, h("b", null, isCorrect(qq, sel) ? "إجابة صحيحة. " : "إجابة غير صحيحة. "), qq.why)));
      }
      return c;

    function optRow(qi, qq, label, val, sel) {
      const selected = sel === val || (typeof sel === "boolean" && sel === val);
      let cls = "q-opt" + (selected ? " sel" : "");

      const { score, pass, byType } = grade();
      const att = S.get(S.KEYS.quizAttempts, []);
      att.push({ at:new Date().toISOString(), score, pass, byType });

    function grade() {
      let correct = 0; const byType = {};

      let obj;

      const v = S.validateBackup(obj);
      const summary = S.summarizeBackup(obj);
      const body = h("div", null,
        v.ok ? alertBox("ok", "ملف صالح", "يمكن المتابعة.") : alertBox("danger", "الملف غير متوافق:", v.errors.join(" / ")),
        summary.length ? h("div", null, h("b", null, "ملخص المحتوى:"), h("ul", null, summary.map(s => h("li", null, s.key + ": " + s.info)))) : null,
        v.errors.filter(e=>e.startsWith("مفتاح")).length ? alertBox("warn","مفاتيح ستُتجاهل:", v.errors.filter(e=>e.startsWith("مفتاح")).join(" / ")) : null);

        const merge = h("button", { class:"btn", onclick: () => { S.importBackup(obj, "merge"); closeModal(); toast("تم الدمج"); navigate("admin"); } }, "دمج مع الحالي");
        const replace = h("button", { class:"btn danger", onclick: () => { if (confirm("سيستبدل البيانات الحالية. متأكد؟")) { S.importBackup(obj, "replace"); closeModal(); toast("تم الاستبدال"); navigate("admin"); } } }, "استبدال الكل");
        body.appendChild(h("div", { class:"toolbar" }, merge, replace, h("button", { class:"btn ghost", onclick: closeModal }, "إلغاء")));

  /* ----------------------------- Doctor profile ----------------------------- */
  function doctorProfile() {
    const navItems = D.navigation.flatMap(g => g.items).filter(i => !["dashboard","admin","about","bookmarks","changelog"].includes(i.id));
    const read = S.get(S.KEYS.readSections, {});
    const contentPct = Math.round(navItems.filter(i => read[i.id]).length / navItems.length * 100);
    const clState = S.get(S.KEYS.checklist, {});
    let total=0, done=0; D.checklist.forEach((g,gi)=>g.items.forEach((_,ii)=>{ total++; if (clState["g"+gi+"_"+ii]) done++; }));
    const checklistPct = total ? Math.round(done/total*100) : 0;
    const casesDone = Object.values(S.get(S.KEYS.cases, {})).filter(p => p.completed).length;
    const att = S.get(S.KEYS.quizAttempts, []);
    const lastExam = att.length ? att[att.length-1].score : null;
    const best = att.length ? Math.max.apply(null, att.map(a => a.score)) : null;
    const passed = att.some(a => a.pass);
    const needsReview = [];
    navItems.forEach(i => { if (!read[i.id]) needsReview.push(i.label); });
    let status = "لم يبدأ";
    if (contentPct > 0 || att.length) status = "قيد التدريب";
    if (contentPct >= 100) status = "أكمل المحتوى";
    if (att.length && !passed) status = "يحتاج مراجعة";
    if (passed) status = "اجتاز الاختبار الداخلي";
    if (passed && contentPct >= 100 && checklistPct >= 100) status = "معتمد داخلياً داخل فريق مذاكراوي";
    return { contentPct, checklistPct, casesDone, lastExam, best, attempts: att.length, status, needsReview: needsReview.slice(0,6) };
  }

  function isStale() {

  /* ----------------------------- Theme & a11y ----------------------------- */
  function applyTheme(t) {
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    S.set(S.KEYS.theme, t || "auto");
    const btn = $("#themeBtn"); if (btn) btn.textContent = (effectiveDark() ? "☀️" : "🌙");
  }
  function effectiveDark() {
    const t = document.documentElement.getAttribute("data-theme");
    if (t === "dark") return true; if (t === "light") return false;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function toggleTheme() { applyTheme(effectiveDark() ? "light" : "dark"); }
  function applyFontScale(scale) {
    scale = Math.min(1.4, Math.max(0.9, scale));
    document.documentElement.style.fontSize = (16 * scale) + "px";
    S.set(S.KEYS.fontScale, scale);
  }

  function closeMobileNav() { $("#sidebar").classList.remove("open"); $("#backdrop").classList.remove("open"); }
  function openMobileNav() { $("#sidebar").classList.add("open"); $("#backdrop").classList.add("open"); }

  /* ----------------------------- Init ----------------------------- */
  function init() {
    // storage availability notice
    if (!S.available()) {
      const b = $("#storageWarn"); if (b) b.style.display = "block";
    }
    // theme
    applyTheme(S.get(S.KEYS.theme, "auto"));
    applyFontScale(S.get(S.KEYS.fontScale, 1));
    // search index
    Q.build(D);
    // sidebar
    buildSidebar();
    // header bindings
    $("#themeBtn").addEventListener("click", toggleTheme);
    $("#menuBtn").addEventListener("click", openMobileNav);
    $("#backdrop").addEventListener("click", closeMobileNav);
    $("#searchBtn").addEventListener("click", openSearch);
    $("#fontUp").addEventListener("click", () => applyFontScale((S.get(S.KEYS.fontScale,1)) + 0.1));
    $("#fontDown").addEventListener("click", () => applyFontScale((S.get(S.KEYS.fontScale,1)) - 0.1));
    $("#searchClose").addEventListener("click", closeSearch);
    $("#searchOverlay").addEventListener("click", e => { if (e.target.id === "searchOverlay") closeSearch(); });
    $("#searchInput").addEventListener("input", e => renderSearch(e.target.value));
    $("#modalClose").addEventListener("click", closeModal);
    $("#modalOverlay").addEventListener("click", e => { if (e.target.id === "modalOverlay") closeModal(); });
    // keyboard
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { closeSearch(); closeModal(); closeMobileNav(); }
      if ((e.ctrlKey || e.metaKey) && e.key === "k") { e.preventDefault(); openSearch(); }
      if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
    });
    // back to top
    const toTop = $("#toTop");
    window.addEventListener("scroll", () => toTop.classList.toggle("show", window.scrollY > 500));
    toTop.addEventListener("click", () => window.scrollTo({ top:0, behavior:"smooth" }));
    // meta chip
    const chip = $("#metaChip"); if (chip) chip.textContent = "العام " + D.meta.academicYear + " · " + D.version;
    // routing
    window.addEventListener("hashchange", render);
    if (!location.hash) location.hash = "#/" + (S.get(S.KEYS.lastRoute, "dashboard"));
    render();
    // welcome (once)
    maybeWelcome();
  }
  function maybeWelcome() {
    const settings = S.get(S.KEYS.settings, {});
    if (settings.welcomed) return;
    const body = h("div", null,
      h("p", null, "مرحباً بك في دليل DrZiad الداخلي لفريق مذاكراوي."),
      alertBox("info", "تنبيه أمني:", D.meta.securityDisclosure),
      h("p", { class:"muted" }, "ابدأ من «خريطة الأنظمة» لتحديد هوية الطالب، ثم استخدم الأدوات والاختبار."),
      h("div", { class:"toolbar" }, h("button", { class:"btn primary", onclick: () => { const s = S.get(S.KEYS.settings, {}); s.welcomed = true; S.set(S.KEYS.settings, s); closeModal(); } }, "ابدأ")));
    openModal("أهلاً بك — DrZiad", body);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

  // تصدير بسيط للاستخدام من وحدة التحكم إن لزم
  window.DrZiadApp = { navigate, render, buildSidebar };
})();

</script>
</body>
</html>
